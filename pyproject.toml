[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qboost"
version = "0.1.0"
description = "QBoost: sparse ensemble selection as a QUBO, solved classically and with QAOA"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aarushi Singh" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=2.2,<3",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "scipy>=1.11",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
